<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Popeye Fighter</title></head><body>
<style>
/* Düzen: tam ekran tek canvas; üstte küçük etiket, altta tuş ipucu ve dokunmatik düğmeler.
   Tek bir görünüm: liman gündüzü (oyun sahnesi), tema ayrımı yok. */
:root{
  --gok-ust:#bfe3ee; --gok-alt:#f1ead2; --deniz:#5a93a6; --kara:#8b6a45; --kara-ust:#a98557;
  --yazi:#1f2a33; --yazi-ters:#fffaf0; --panel:rgba(255,250,240,.88); --cizgi:#1f2a33;
  --font:'Bangers','Arial Black',Impact,sans-serif; --font-ui:'Nunito','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--gok-ust);color:var(--yazi);overflow:hidden;font-family:var(--font-ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.etiket{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border:2px solid var(--cizgi);border-radius:6px;padding:6px 12px;font-size:14px;font-weight:700;letter-spacing:.02em}
.etiket b{font-family:var(--font);font-size:20px;letter-spacing:.06em;font-weight:400;margin-right:8px}
.ipucu{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border:2px solid var(--cizgi);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700}
.tus{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:80px;height:80px;border:0;background:transparent center/contain no-repeat;font-size:0;display:none;
  user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .05s,filter .05s}
#sol{background-image:url(ui/btn_sol.png?v=43)}#sag{background-image:url(ui/btn_sag.png?v=43)}#zipla{background-image:url(ui/btn_yuk.png?v=43)}#asa{background-image:url(ui/btn_asa.png?v=43)}
#kombolB{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:64px;height:64px;background:url(ui/btn_liste.png?v=43) center/contain no-repeat;cursor:pointer;touch-action:manipulation;transition:transform .05s,filter .05s}
#kombolB:active{transform:scale(.92);filter:brightness(.8)}
#liste{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(31,42,51,.6)}#liste[hidden]{display:none}
.kagit{position:relative;width:min(96vw,calc(94vh*0.558));aspect-ratio:1536/2752;background:url(ui/kagit.png?v=43) center/100% 100% no-repeat;container-type:inline-size}
#liste_ic{position:absolute;left:15%;right:13%;top:22%;bottom:21%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#liste_ic::-webkit-scrollbar{display:none}
.sat{display:flex;align-items:center;gap:2.2cqw;padding:1.6cqw 0;border-bottom:.5cqw dashed rgba(70,45,20,.4)}
.sat.yeni{border-top:.9cqw solid rgba(70,45,20,.55)}
.sat b{font-family:var(--font);font-weight:400;font-size:7cqw;width:9cqw;text-align:center;color:#4a2f18}
.sat img{height:7cqw;width:auto}

canvas{cursor:crosshair}.etiket,.ipucu{pointer-events:none}
.mini{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  background:var(--panel);border:2px solid var(--cizgi);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--yazi);user-select:none;-webkit-user-select:none;cursor:pointer}
#kapat{display:none;padding:2px 10px;font-size:18px;line-height:1.3;opacity:.7}
.sensor #kapat{display:block}
.sensor .tus,.sensor #kombolB,.sensor #sens,.sensor #sifir,.sensor #tam,.sensor .ipucu,.sensor .etiket{display:none!important}
#tam{top:calc(54px + env(safe-area-inset-top,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 118px);padding:6px 10px}
#sifir{top:calc(54px + env(safe-area-inset-top,0px))}
.tus:active,.tus.bas{transform:scale(.92);filter:brightness(.8)}
@media (pointer:coarse){ .tus{display:flex} .ipucu{display:none} }
#sol{left:max(16px,env(safe-area-inset-left,0px))} #sag{left:calc(max(16px,env(safe-area-inset-left,0px)) + 88px)}
#zipla{right:max(16px,env(safe-area-inset-right,0px))}
#asa{right:calc(max(16px,env(safe-area-inset-right,0px)) + 88px)}
#yuk[hidden]{display:none}
#yuk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--gok-ust);font-family:var(--font);font-size:28px;letter-spacing:.08em}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800&display=swap">

<canvas id="c"></canvas>
<div class="etiket"><b>POPEYE FIGHTER</b>v2.22</div>
<div class="ipucu">← → yürü &nbsp; ↑ zıpla &nbsp; J yumruk &nbsp; K tekme &nbsp; G süpermen &nbsp; B dönen tekme &nbsp; N yer yumruğu/süper iniş &nbsp; M kayma &nbsp; ↓ çömel &nbsp; <b>sağ/sol yarıya tık tık: kombo &nbsp; sürükle: sağ yarı ön kol, sol yarı arka kol</b></div>
<div class="tus" id="asa" aria-label="eğil"></div><div class="tus" id="sol" aria-label="sol"></div><div class="tus" id="sag" aria-label="sağ"></div><div class="tus" id="zipla" aria-label="zıpla"></div>
<div id="kombolB" aria-label="kombo listesi"></div>
<div id="liste" hidden><div class="kagit"><div id="liste_ic"></div></div></div>
<div class="mini" id="sens">🎮 SENSÖR: KAPALI</div><div class="mini" id="sifir">⟲ Dengele</div>
<div class="mini" id="tam">⛶ Tam ekran</div>
<div class="mini" id="kapat">✕</div>
<div id="yuk">YÜKLENİYOR…</div>

<script>
(function(){
'use strict';
// ---------- Parçalar ----------
const ADLAR=['kafa','govde','kalca','ustkol','onkol','onkol2','uyluk','altpan','bacak_bot','el_yum','el_yum_f','el_ac_n','el_ac_f','z_kafa','z_govde','z_kalca','z_ust','z_onA','z_onB','z_ayak','z_bacak','d_kafa','d_govde','d_kalca','d_ustA','d_onA','d_ustB','d_onB','d_uyluk','d_ayak','e_kafa','e_isir','e_govde','e_kalca','e_ustA','e_onA','e_ustB','e_onB','e_bacak','e_ayakA','e_ayakB','k_kafa','k_govde','k_kalca','k_ust','k_on','k_elN','k_elF','k_uyN','k_uyF','k_bacak','b_kafa','b_govde','b_kalca','b_ust','b_on','b_elN','b_elF','b_uyN','b_uyF','b_bacak'];
const RES=2;                       // yeni parça görselleri oyun biriminin 2 katı çözünürlükte
const R={};
function koyult(img,al=.28){            // arka taraftaki uzuvlar için hafif koyu kopya
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  x.globalCompositeOperation='source-atop';x.fillStyle='rgba(40,35,60,'+al+')';x.fillRect(0,0,c.width,c.height);
  return c;
}
let kalan=ADLAR.length;
ADLAR.forEach(a=>{
  const im=new Image();
  im.onload=()=>{R[a]=im;if(--kalan===0){['ustkol','onkol2','uyluk','altpan','bacak_bot'].forEach(n=>R[n+'_k']=koyult(R[n]));
    ['ustkol','onkol2','el_yum_f','el_ac_n'].forEach(n=>R[n+'_a']=koyult(R[n],.13));      // arka kol ve eli aynı tonda koyu
    R.e_ustB_k=koyult(R.e_ustB,.3);R.e_onB_k=koyult(R.e_onB,.3);R.e_bacak_k=koyult(R.e_bacak,.36);R.e_ayakB_k=koyult(R.e_ayakB,.36);R.d_ustA_k=koyult(R.d_ustA,.3);R.d_onA_k=koyult(R.d_onA,.3);R.d_uyluk_k=koyult(R.d_uyluk,.38);R.d_ayak_k=koyult(R.d_ayak,.38);
    for(const q of ['k_','b_']){R[q+'ust_k']=koyult(R[q+'ust'],.13);R[q+'on_k']=koyult(R[q+'on'],.13);R[q+'elF_k']=koyult(R[q+'elF'],.13);R[q+'uyF_k']=koyult(R[q+'uyF'],.3);R[q+'bacak_k']=koyult(R[q+'bacak'],.3)}      // korsanın arkadaki kolu/bacağı
    R.z_ust_k=koyult(R.z_ust,.3);R.z_onA_k=koyult(R.z_onA,.3);R.z_bacak_k=koyult(R.z_bacak,.36);R.z_ayak_k=koyult(R.z_ayak,.36);      // zombinin arkadaki kolu/bacağı daha koyu   // arkadaki kol: bacaktan daha açık ton
    basla();}};
  im.onerror=()=>{document.getElementById('yuk').textContent='Parça yüklenemedi: '+a};
  im.src='parca/'+a+'.png?v=44';          // ?v= : görsel değişince tarayıcı eski önbelleği kullanmasın
});
const YUZ=[];                      // ana yüz: 0 = tam can ... 9 = çok az can, 10 = ölü
for(let i=0;i<11;i++){const im=new Image();im.src='yuz/yuz'+i+'.png?v=41';YUZ.push(im)}
const YUZA=[];                     // darbe tepkisi: ağıran yüz, vurulmadan ÖNCEKİ can aralığına göre (0-9)
for(let i=0;i<10;i++){const im=new Image();im.src='yuz/yuzA'+i+'.png?v=42';YUZA.push(im)}
function yuzNo(hp){return hp<=0?10:Math.min(9,Math.floor((100-hp)/10))}   // 100-91→0, 90-81→1 ... 10-1→9, 0→10

// ---------- Ayarlar (parça birimi) ----------
const CR_H=320;                 // çömelmede kalça yüksekliği
const BACAK_BOY=477;            // eklemden zemine (kalça-diz 206 + diz-bilek 172 + bilek-taban 99)
const KARAKTER_BOY=1020;
const HIZ=1100, G=5600, ZIP1=2700, ZIP2=2400;
const D=Math.PI/180;
// [başlangıç x, yükseklik]; sol baştaki ve sağ sondaki yüksek duvar bölümün sınırı
const ZEMIN=[[-1e9,0]];      // şimdilik düz zemin
const BOSS_X=21000;

// ---------- Durum ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1,GOK=null;
function boyut(){
  DPR=Math.min(window.devicePixelRatio||1,2);GOK=null;   // 3x çözünürlük telefonda çok pahalı: en fazla 2x
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  SC=Math.min(H*0.58/KARAKTER_BOY, W*0.45/KARAKTER_BOY);
}
window.addEventListener('resize',boyut);boyut();

const key={sol:false,sag:false,zipla:false,asagi:false};
const S={camY:0,atk:null,kuyruk:[],dizi:{j:0,k:0},sonAtk:-9,x:0,y:0,vx:0,vy:0,yer:true,yon:1,ziplaTut:false,ekstra:1,spin:0,donuyor:false,faz:0,t:0};
const ROLL_SURE=0.55;
const P={}; // yumuşatılmış açılar
function tus(e,d){
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')key.sol=d;
  else if(k==='ArrowRight'||k==='d'||k==='D')key.sag=d;
  else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'||k==='z'||k==='Z'){ if(d&&!key.zipla)ziplaBas(); key.zipla=d; }
  else if(k==='ArrowDown'||k==='s'||k==='S')key.asagi=d;
  else if((k==='j'||k==='J')&&d&&!e.repeat){S.jEl=S.jEl==='N'?'F':'N';komboTap('y',S.jEl)}      // dokunmatikteki gibi yumruk (eller sırayla), kombo zinciri çalışır
  else if((k==='k'||k==='K')&&d&&!e.repeat){S.kEl=S.kEl==='N'?'F':'N';tekmeAt(S.kEl)}            // tekme
  else if('gGhHbBnNmM'.includes(k)&&k.length===1&&d&&!e.repeat)ozelTus(k.toLowerCase());
  else return;
  e.preventDefault();
}
addEventListener('keydown',e=>tus(e,true));addEventListener('keyup',e=>tus(e,false));
function dokunTus(id,fn){
  const el=document.getElementById(id);
  const bas=e=>{e.preventDefault();el.classList.add('bas');fn(true)};
  const birak=e=>{e.preventDefault();el.classList.remove('bas');fn(false)};
  el.addEventListener('pointerdown',bas);el.addEventListener('pointerup',birak);
  el.addEventListener('pointerleave',birak);el.addEventListener('pointercancel',birak);
}
dokunTus('asa',d=>key.asagi=d);
dokunTus('sol',d=>key.sol=d);dokunTus('sag',d=>key.sag=d);
dokunTus('zipla',d=>{if(d&&!key.zipla)ziplaBas();key.zipla=d});

// ---------- Sensör: telefonu direksiyon gibi tut ----------
// sağa/sola çevir = yürü (eğim ne kadar büyükse o kadar hızlı), direksiyonu hızla arkaya kır (ekran tavana) = zıpla (şiddet = zıplama gücü),
// ekranı kendine doğru yatır = çömel
const GYRO={egilKal:false,egilHazir:true,hazir:true,ak:false,steer:0,egil:false,zipBit:-9,u0z:0,kalT:0,oz:null,rate:0,sonT:0,sonZip:-9};
const ACI_OLU=3.5, ACI_TAM=20, ZIP_ESIK=2.2;
const asagiMi=()=>key.asagi||GYRO.egilKal;
const ziplaTut=()=>key.zipla||S.t<GYRO.zipBit;
function ekranAci(){const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);return((a%360)+360)%360}
function gyroAx(){
  if(!GYRO.ak||performance.now()/1000-GYRO.sonT>0.5)return 0;
  const a=Math.abs(GYRO.steer);if(a<ACI_OLU)return 0;
  const r=a<8?0.12+0.33*(a-ACI_OLU)/(8-ACI_OLU):0.45+0.55*Math.min(1,(a-8)/(ACI_TAM-8));   // çok az eğim = rahat yürüyüş, ~20° = tam koşu
  return Math.sign(GYRO.steer)*Math.min(1,r);
}
function sensorOku(e){
  if(e.beta==null||e.gamma==null)return;
  const now=performance.now()/1000, b=e.beta*D, g=e.gamma*D;
  const ux=-Math.sin(g)*Math.cos(b), uy=Math.sin(b), uz=Math.cos(g)*Math.cos(b);   // "yukarı" vektörü cihaz eksenlerinde
  const a=ekranAci();let sr,su;                                                   // ekran düzlemine çevir
  if(a===90){sr=-uy;su=ux}else if(a===270){sr=uy;su=-ux}else if(a===180){sr=-ux;su=-uy}else{sr=ux;su=uy}
  if(Math.hypot(sr,su)>0.35){const ang=Math.max(-90,Math.min(90,Math.atan2(-sr,su)/D));GYRO.steer+=(ang-GYRO.steer)*0.4}
  else GYRO.steer*=0.8;
  if(now<GYRO.kalT){GYRO.u0z=uz;GYRO.oz=uz;GYRO.sonT=now;return}                 // dengeleme: tuttuğun duruş "nötr"
  const dz=uz-GYRO.u0z;
  if(dz<-0.35){if(GYRO.egilHazir){GYRO.egilKal=!GYRO.egilKal;GYRO.egilHazir=false}}   // ekranı kendine yatır: eğil / bir daha yatır: kalk
  else if(dz>-0.22)GYRO.egilHazir=true;
  if(GYRO.oz!==null&&GYRO.sonT>0){
    const dt=now-GYRO.sonT;
    if(dt>0.001){GYRO.rate+=((uz-GYRO.oz)/dt-GYRO.rate)*0.5}
  }
  GYRO.oz=uz;GYRO.sonT=now;
  const kosu=S.yer&&Math.abs(S.vx)>HIZ*0.4;                   // koşarken minik hareket bile yüksek zıplatır
  if(GYRO.rate<0.3||now-GYRO.sonZip>0.6)GYRO.hazir=true;     // bir hareket = bir zıplama (yürürken titreme kilitlemesin diye zaman aşımı var)
  const esik=S.yer?(kosu?0.8:1.0):0.7;
  if(GYRO.hazir&&GYRO.rate>esik&&now-GYRO.sonZip>0.2){
    const guc=Math.min(1.45,Math.max(S.yer?0.8:0.85,0.8+0.5*Math.min(1,(GYRO.rate-esik)/2.5))*(kosu?1.18:1));
    ziplaBas(guc);GYRO.zipBit=S.t+0.9;GYRO.sonZip=now;GYRO.hazir=false;
  }
}
const sensBtn=document.getElementById('sens'), yaz=t=>{sensBtn.textContent='🎮 SENSÖR: '+t};
async function sensorToggle(){
  if(GYRO.ak){GYRO.ak=false;GYRO.egilKal=false;GYRO.steer=0;document.body.classList.remove('sensor');removeEventListener('deviceorientation',sensorOku);yaz('KAPALI');return}
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted'){yaz('İZİN YOK');return}
    }
  }catch(_){yaz('İZİN YOK');return}
  GYRO.steer=0;GYRO.rate=0;GYRO.sonT=0;GYRO.oz=null;GYRO.kalT=performance.now()/1000+1.5;GYRO.ak=true;document.body.classList.add('sensor');
  addEventListener('deviceorientation',sensorOku);
  yaz('HAZIRLAN… (nötr tut)');
  setTimeout(()=>{if(!GYRO.ak)return;yaz(GYRO.sonT?'AÇIK':'VERİ YOK')},1600);
}
sensBtn.addEventListener('click',sensorToggle);
const tamBtn=document.getElementById('tam');
tamBtn.addEventListener('click',async()=>{
  try{
    if(document.fullscreenElement){await document.exitFullscreen();if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();return}
    await document.documentElement.requestFullscreen({navigationUI:'hide'});
    try{await screen.orientation.lock('landscape')}catch(_){}
  }catch(_){tamBtn.textContent='⛶ Desteklenmiyor';setTimeout(()=>tamBtn.textContent='⛶ Tam ekran',1800)}
});
document.getElementById('kapat').addEventListener('click',()=>{if(GYRO.ak)sensorToggle()});
document.getElementById('sifir').addEventListener('click',()=>{if(GYRO.ak){GYRO.kalT=performance.now()/1000+1;yaz('HAZIRLAN… (nötr tut)');setTimeout(()=>{if(GYRO.ak)yaz('AÇIK')},1100)}});

// ---------- Kol kontrolü: ekranda sürükle, kol o yöne vursun ----------
// sağ yarı = ön kol (N), sol yarı = arka kol (F). Sürükleme yönü = kolun yönü, mesafe = uzanma
const KOL={N:{ak:false,th:0,e:0,bit:-9},F:{ak:false,th:0,e:0,bit:-9}};
const izler=new Map(), SINIR=14, TAM=120, TUT=0.14;
const kolAktif=k=>k.ak||S.t-k.bit<TUT;
const kolVar=()=>kolAktif(KOL.N)||kolAktif(KOL.F);
const tutan=k=>DUS.some(e=>e.tut&&!e.olu&&(e.tut===k||e.iki));      // bu el bir düşmanı tutuyor mu (iki elle tutuşta ikisi de)
const ikiYakin=()=>{if(S.t-(S.yirtT||-9)<1)return true;if(!(KOL.N.ak&&KOL.F.ak))return false;for(const e of DUS){if(e.olu||e.tut||e.boss)continue;if(Math.hypot(EL.N.wx-e.x,EL.N.wy-(e.y+e.cy))<e.r+70&&Math.hypot(EL.F.wx-e.x,EL.F.wy-(e.y+e.cy))<e.r+70)return true}return false};
const izBul=t=>{for(const z of izler.values())if(z.t===t)return z;return null};
function izHiz(iz,pen){          // piksel/sn: son 'pen' saniyedeki yer değiştirme
  const h=iz.hist;if(h.length<2)return 0;
  const son=h[h.length-1];let a=h[0];for(const q of h){if(son.t-q.t<=pen){a=q;break}}
  const dt=son.t-a.t;return dt>0.02?Math.hypot(son.x-a.x,son.y-a.y)/dt:0;
}
function kayma(iz,pen){          // son 'pen' saniyede: yer değiştirme ve izlenen yol
  const h=iz.hist;if(h.length<2)return null;
  const son=h[h.length-1];let a=h[0];for(const q of h){if(son.t-q.t<=pen){a=q;break}}
  let yol=0,pr=a;for(const q of h){if(q.t<=a.t)continue;yol+=Math.hypot(q.x-pr.x,q.y-pr.y);pr=q}
  return {dx:son.x-a.x,dy:son.y-a.y,d:Math.hypot(son.x-a.x,son.y-a.y),yol};
}
function kolHesap(iz,x,y){
  let yn=iz.yon;
  if(tutan(iz.t)){                       // tutan kol: karakter dönünce kol sıçramaz, parmak hareketi ekranda aynı yöne çalışır
    yn=S.yon;if(iz.hy===undefined)iz.hy=yn;
    if(iz.hy!==yn){iz.x0=x+(x-iz.x0);iz.hy=yn}         // sabitleme noktası yansıtılır: kolun açısı aynı kalır, devamı parmağı izler
  }else iz.hy=undefined;
  const dx=(x-iz.x0)*yn, dy=y-iz.y0, L=Math.hypot(dx,dy), k=KOL[iz.t];
  if(DUS.some(e=>e.tut&&e.tut!==iz.t&&!e.iki)){k.e=0;return}       // diğer elle tutuyorsak: bu taraf kol hareketi/jest yapmaz, dokunuşlar tutulana vuruş olur
  if(L<SINIR){k.e=0;return}
  k.th=Math.atan2(dy,dx)/D;

    if(p.k===1){w=170*p.s;ay=0.82;sc=Math.min(1,0.35+u/0.12);al=0.85*(u<0.7?1:Math.max(0,1-(u-0.7)/0.6))}

function vur(e,dmg,vx,vy,f,hy){

function vurusKontrol(){

  for(const k of ['N','F']){

    for(const e of DUS){
      if(e.olu||e.hitT[k]>S.t||e.tut===k||e.iki)continue;      // kendi tuttuğuna vurmaz, diğer elle vurabilir
      if(Math.hypot(h.wx-e.x,h.wy-(e.y+e.cy))>e.r+60)continue;
      const f=kisit((h.v-1500)/6000,0,1);
      const kd=kDmg(S.atk);if(kd!==null&&!S.atk.tv)S.cE=e;
      S.pSes=true;S.pHx=h.wx;vur(e,kd!==null&&!S.atk.tv?kd:5,h.vx,h.vy,f,h.wy);S.pSes=false;S.pHx=undefined;e.hitT[k]=S.t+0.4;
    }
  }
  if(S.kay&&S.t<S.kay.t0+S.kay.T&&S.yer){      // Sub-Zero kayması: alçak çelme, havaya fırlatır
    for(const e of DUS){
      if(e.olu||e.kyT===S.kay.t0)continue;
      const dx=(e.x-S.x)*S.yon;
      if(dx<-100||dx>520+e.r*0.7||e.y>S.y+300)continue;
      e.kyT=S.kay.t0;S.pSes='tekme';vur(e,18,S.yon*0.5,1,0.6,S.y+50);S.pSes=false;if(!e.tut&&e.t!=='dev'){e.vy=1900;e.vx=S.yon*300}      // kayan tekme: yarım zıplama kadar yukarı, çok az ileri
    }

  if(S.sman){                       // süpermen uçuşu: önündeki her şeye çarpar
    const m=S.sman;
    for(const e of DUS){
      if(e.olu||e.smT===m.t0)continue;
      const dx=(e.x-S.x)*m.dir,ey=e.y+e.cy-S.y;
      if(dx>-150&&dx<650+e.r&&ey>-e.r&&ey<1000){e.smT=m.t0;vur(e,50,m.dir,0.15,0.7+0.3*m.ch,S.y+400)}
    }

  if(S.dkick){                      // uçan tekme: ayak ucu çarptığına sert vurur
    const al=S.dkick.al*D,fx=S.x+S.dkick.dir*Math.sin(al)*430,fy=S.y+398-Math.cos(al)*430;
    for(const e of DUS){
      if(e.olu||e.dkT===S.dkick.t0)continue;
      if(Math.hypot(fx-e.x,fy-(e.y+e.cy))<e.r+130){e.dkT=S.dkick.t0;S.pSes='tekme';vur(e,30,S.dkick.dir,-0.5,0.8,fy);S.pSes=false}
    }
  }
  if(S.tats>0){                     // kasırga: etrafındaki herkese vurur
    for(const e of DUS){
      if(e.olu||e.tsT>S.t)continue;
      const dx=e.x-S.x,ey=e.y+e.cy-S.y;
      if(Math.abs(dx)<480+e.r*0.6&&ey>-e.r&&ey<900){e.tsT=S.t+1.0;vur(e,50,dx>=0?1:-1,0.4,0.5,S.y+400)}
    }
  }
  if(S.shoryu>0&&S.vy<0){           // shoryuken: yükselirken önündeki ve üstündeki düşmanlara sert vurur
    for(const e of DUS){
      if(e.olu||e.shT===S.shId)continue;
      const dx=(e.x-S.x)*S.yon,ey=e.y+e.cy-S.y;
      if(dx>-150&&dx<500+e.r&&ey>-100&&ey<1300){e.shT=S.shId;vur(e,32,S.yon*0.3,1,0.85,S.y+900)}
    }
  }
  const a=S.atk;
  if(a&&a.tv&&!a.tvH&&a.t/HAREKET[a.ad].dur>=0.3){      // tutulana vuruş: kolun yumruğu vurduğu anda hasar
    a.tvH=true;
    const e=DUS.find(x=>x.tut&&!x.olu);
    if(e){const L=a.ad[0],dm={j:6,c:12,h:10,u:14,o:16,b:9,w:8,s:18,z:15,k:17}[L]||8;S.pSes=true;vur(e,dm,S.yon,L==='u'?1:(L==='o'?-0.6:0.1),0.4+dm/40,e.y+e.cy);S.pSes=false}
  }
  if(a&&/^(kick|diz)/.test(a.ad)){      // tekme / diz: sabit hasar, öne doğru fırlatır (çift tekmede iki ayrı vuruş penceresi)
    const mv=HAREKET[a.ad],u=a.t/mv.dur,PEN=mv.win||[[0.4,0.7]];
    a.vw=a.vw||[];
    for(let wi=0;wi<PEN.length;wi++){

function grabKontrol(dt){

      const d=Math.hypot(h.wx-e.x,h.wy-(e.y+e.cy));

    }
    if(!en){DW[k]=0;continue}
