# Android derlemesi: SADECE elle (Actions > "Android Build" > Run workflow); push'ta çalışmaz
# - Secrets varsa: imzalı AAB (Google Play'e yüklenecek) + imzalı APK
# - Secrets yoksa: imzasız AAB + debug APK (telefona kurup test için)
# versionCode = çalıştırma numarası, her derlemede otomatik artar.
name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sync (www -> android)
        run: npx cap sync android

      - name: Sürüm bilgisi
        run: |
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV
          echo "VERSION_NAME=$(grep -oP "SURUM:\s*'v\K[^']+" www/config.js)" >> $GITHUB_ENV

      - name: Keystore hazırla (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi

      - name: Derle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: popeyefighter-${{ env.VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: popeyefighter-${{ env.VERSION_NAME }}-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
